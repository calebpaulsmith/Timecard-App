name: iOS CI

# Domain unit tests for the native iOS app (iOS/). Runs only when iOS files (or
# this workflow) change, so PWA-only changes don't spin up a macOS runner.
# No signing / secrets needed.
on:
  push:
    branches: [main]
    paths: ['iOS/**', '.github/workflows/ios-ci.yml']
  pull_request:
    paths: ['iOS/**', '.github/workflows/ios-ci.yml']

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: iOS

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Maxiflex.xcodeproj \
            -scheme Maxiflex \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
