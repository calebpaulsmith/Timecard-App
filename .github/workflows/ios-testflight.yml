name: iOS TestFlight

# Builds a Release archive of the iOS app (iOS/) and uploads it to TestFlight.
# Trigger manually (Actions -> iOS TestFlight -> Run workflow) or by pushing a
# version tag:  git tag v0.2.0 && git push origin v0.2.0
# A tag push ALSO sets the marketing version (v0.2.0 -> 0.2.0); a manual run
# keeps the project.yml default version and just bumps the build number.
# Requires the App Store Connect + match secrets (see iOS/docs/CICD-SETUP.md).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: iOS

jobs:
  beta:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iOS

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # Monotonic build number so each TestFlight upload is unique.
          BUILD_NUMBER: ${{ github.run_number }}
          # On a tag push (v0.2.0), set the marketing version to 0.2.0; empty on
          # a manual run, where the Fastfile keeps the project.yml default.
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bundle exec fastlane beta

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-and-logs
          path: |
            iOS/build/*.ipa
            iOS/build/*.app.dSYM.zip
          if-no-files-found: ignore
