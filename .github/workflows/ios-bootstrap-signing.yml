name: iOS Bootstrap signing

# Run ONCE (Actions -> iOS Bootstrap signing -> Run workflow) after the secrets
# and the certificates repo are set up. Creates the distribution certificate +
# App Store provisioning profile via the App Store Connect API and stores them,
# encrypted, in the certificates repo. The TestFlight workflow then fetches them
# read-only. Re-run only if certs expire/are revoked. See iOS/docs/CICD-SETUP.md.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: iOS

jobs:
  bootstrap:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iOS

      - name: Create & store signing assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane signing_bootstrap
