name: Bootstrap signing

# Run this ONCE (Actions tab -> Bootstrap signing -> Run workflow) after the
# secrets and the certificates repo are set up. It creates your distribution
# certificate + App Store provisioning profile via the App Store Connect API and
# stores them, encrypted, in the certificates repo. After this, the TestFlight
# workflow fetches them read-only. Re-run only if certs expire/are revoked.
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Create & store signing assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane signing_bootstrap
