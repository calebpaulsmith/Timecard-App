# XcodeGen spec. On a Mac:  brew install xcodegen && xcodegen generate
# Then open Maxiflex.xcodeproj. Hand-editing a .pbxproj is fragile; this file
# is the source of truth for the project structure.
name: Maxiflex
options:
  bundleIdPrefix: com.calebsmith.maxiflex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team on the Mac (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Maxiflex:
    type: application
    platform: iOS
    sources:
      - path: Maxiflex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calebsmith.maxiflex
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maxiflex
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # App Group reserved for the future widget extension (Phase 7). Do not change
    # this ID casually — the widget reads the shared SwiftData store through it.
    #   group.com.calebsmith.maxiflex
    # Entitlement is intentionally left off until widgets land, so the first
    # build needs no special provisioning.

  MaxiflexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MaxiflexTests
    dependencies:
      - target: Maxiflex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.calebsmith.maxiflex.tests

schemes:
  Maxiflex:
    build:
      targets:
        Maxiflex: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MaxiflexTests
    archive:
      config: Release
