# XcodeGen spec. On a Mac:  brew install xcodegen && xcodegen generate
# Then open Timecard.xcodeproj. Hand-editing a .pbxproj is fragile; this file
# is the source of truth for the project structure.
#
# Note: the Xcode target/scheme/module and on-device name are unified on
# "Timecard." The bundle id + App Group use the com.thegrandpipeline.timecard
# identifier — the App ID already registered on the Apple Developer account
# (alongside the owner's other com.thegrandpipeline.* apps), with a matching
# "Timecard" record in App Store Connect. "maxiflex" survives only as the
# federal *schedule* term in the Domain.
name: Timecard
options:
  bundleIdPrefix: com.thegrandpipeline.timecard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Build configurations. "Personal" is a debug-type config that additionally
# defines the PERSONAL compilation condition, enabling the calendar / life /
# tax exploration (see App/FeatureFlags.swift + ../PLATFORM-STRATEGY.md).
# Debug/Release are the PRODUCTION (App Store / pay) faces — no PERSONAL.
configs:
  Debug: debug
  Release: release
  Personal: debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team on the Mac (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Timecard:
    type: application
    platform: iOS
    # Sources live directly under iOS/ (the repo was flattened into the monorepo).
    # Add Store/Features/Platform here as those folders are created.
    sources:
      - path: App
      - path: Domain
      - path: Store
      - path: Features
      - path: Platform
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thegrandpipeline.timecard
        # Authoritative Info.plist (see iOS/Info.plist). GENERATE is off because the
        # document-type + URL-scheme arrays (for opening .ics/webcal activities)
        # can't be expressed as INFOPLIST_KEY_* build settings, and mixing GENERATE
        # with a custom file has undocumented merge behavior. The plist carries every
        # key the generated one produced (display name, encryption flag, launch/scene,
        # orientation, calendar usage strings) and uses $(MARKETING_VERSION) /
        # $(CURRENT_PROJECT_VERSION) so the release pipeline's version override still
        # applies. When adding a scalar Info.plist key, add it to iOS/Info.plist.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Personal edition: enable the PERSONAL flag (keeps DEBUG too).
        Personal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PERSONAL
    # App Group reserved for the future widget extension (Phase 7). Do not change
    # this ID casually — the widget reads the shared SwiftData store through it.
    #   group.com.thegrandpipeline.timecard
    # Entitlement is intentionally left off until widgets land, so the first
    # build needs no special provisioning.

  TimecardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimecardTests
    dependencies:
      - target: Timecard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.thegrandpipeline.timecard.tests

schemes:
  # PRODUCTION face — the sellable Timecard (core + Pro). This is what ships to
  # the App Store (archive = Release). CI runs this scheme.
  Timecard:
    build:
      targets:
        Timecard: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TimecardTests
    archive:
      config: Release

  # PERSONAL face — core + calendar/life/tax exploration (PERSONAL flag on).
  # For your own use; NOT the App Store build.
  Timecard Personal:
    build:
      targets:
        Timecard: all
    run:
      config: Personal
    test:
      config: Personal
      gatherCoverageData: true
      targets:
        - TimecardTests
    archive:
      config: Personal
